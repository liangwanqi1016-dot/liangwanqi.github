<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠퍼스 다이어리</title><style>body{margin:0;background:#f8f3e9;color:#392e27;font:16px/1.8 Arial,sans-serif}main{max-width:540px;margin:15vh auto;padding:24px}h1{font-family:Georgia,Batang,serif;font-weight:400}a{color:#79503b}</style></head><body><main><h1>캠퍼스 다이어리</h1><p id="message">과제 페이지로 이동합니다. 서버가 잠들어 있으면 첫 화면까지 약 1분 걸릴 수 있습니다.</p><a id="open" href="https://campus-image-week6.onrender.com/">열기 · 打开 · Open</a><p><a href="../">과제 모음 · 作业总入口 · Assignments</a></p></main><script>let lang=new URL(location.href).searchParams.get('lang');try{lang=lang||localStorage.getItem('campus.language')}catch(_){}if(lang==='zh')document.getElementById('message').textContent='正在打开作业页面。服务器休眠时，首次启动可能需要约一分钟。';if(lang==='en')document.getElementById('message').textContent='Opening your assignment. A sleeping server may take about a minute to start.';const target=new URL(document.getElementById('open').href);if(['ko','zh','en'].includes(lang))target.searchParams.set('lang',lang);document.getElementById('open').href=target.href;location.replace(target.href);</script></body></html>
