<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Star Collection Game</title>
        <style>
           *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           }
           body{
            font-family: Arial,sans-serif;
            background-color: #f4f6fb;
            color: #253047;
            padding-bottom: 30px;
           }
           header{
            background-color: #483c8c;
            color: #fff;
            text-align: center;
            padding: 20px 16px;
           }
           header h1{
            font-size: clamp(1.2rem,4vw,1.6rem);
            margin-bottom: 4px;
           }
           header p{
            font-size: clamp(0.8rem,2vw,0.95rem);
            opacity: 0.85;
           }
           main{
            max-width: 700px;
            margin: 20px auto;
            padding: 0 14px;
           }
           .game-card{
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
           }
           #gameCanvas{
            width: 100%;
            border-radius: 10px;
            background: #141d3a;
            touch-action:manipulation;
           }
           .hud{
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0;
            font-weight: bold;
            font-size: clamp(0.9rem,2vw,1rem);
           }
           .control-tip{
            margin: 10px 0;
            font-size: clamp(0.8rem,2vw,0.88rem);
            color: #555;
           }
           .btn-group{
            display: flex;
            gap: 10px;
            margin-top: 14px;
           }
           button{
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #483c8c;
            color: #fff;
            font-size: clamp(0.9rem,2vw,1rem);
            cursor: pointer;
            transition: 0.2s;
           }
           button:active{
            background: #392f72;
           }
           button:focus-visible{
            outline: 3px solid #c56200;
            outline-offset: 3px;
           }
           #message{
            margin-top: 10px;
            min-height: 22px;
           }
           footer{
            text-align: center;
            margin-top: 24px;
            color: #777;
            font-size: 0.8rem;
           }
           @media(max-width:576px){
            .btn-group{
                flex-direction: column;
                gap: 8px;
            }
           }
        </style>
    </head>
    <body>
        <header>
            <h1>Star Collection Game</h1>
        </header>
        <main>
            <div class="game-card">
                <canvas id="gameCanvas" width="600" height="320"
                aria-label="Click yellow stars, avoid red traps">Your browser does not support Canvas. Please update your browser.</canvas>
                <div class="hud">
                <span id="score">Score:0/12</span>
                <span id="time">Time Left: 20s</span>
                <span id="best">Best Score:0</span>
                </div> 
                <p id="message" role="status">Click Start to begin adventure</p>
                <div class="control-tip">
                    📱：Tap screen<br>
                    💻：Mouse Click
                </div>
                <div class="btn-group">
                    <button id="startBtn">Start Game</button>
                    <button id="resetBtn">Reset Game</button>
                </div>
            </div>
        </main>
        <footer>Web Programming</footer>
        <script src="game.js"></script>
    </body>
</html>
